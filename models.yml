# Model Configuration — Cloud routing via OpenCode Go / OpenRouter
#
# Default: all agents on cloud — no local LLM needed during production.
# Local NInfer providers (ninfer :8080, ninfer-us :8081) are registered
# in ~/.dsh/settings.yaml for cloud-fallback and manual local routing.
# systemd Conflicts= means only one ninfer unit holds the RTX 5090.
#
# dsh-engine-switch plugin is NOT installed (404s on npm), so per-preset
# engine declarations in agent.cordis.yml are inert. Instead, run.sh
# rewrites the agent-default-model section of ~/.dsh/settings.yaml
# before each agent call via set_agent_model().

# Per-preset model routing (managed by run.sh set_agent_model)
routing:
  # Reasoning + vision agents → DeepSeek V4 Pro (text+image, 1M context, high effort)
  reasoning_agents:
    - story-creator
    - director
    - screenplay-reviewer
    - character-designer
    - location-designer
    - qa-inspector
  reasoning_provider: "opencode-go-deepseek-pro"
  reasoning_model: "deepseek-v4-pro"
  reasoning_effort: "high"

  # Execution agents → DeepSeek V4.1 Flash (text+image, 1M context, low effort)
  execution_agents:
    - storyboard-artist
    - image-generator
    - audio-producer
    - music-composer
    - video-generator
    - qa-inspector
    - pipeline-orchestrator
    - subtitle-generator
    - post-production-editor
  execution_provider: "opencode-go-deepseek"
  execution_model: "deepseek-v4.1-flash"
  execution_effort: "low"

# Local NInfer providers (in ~/.dsh/settings.yaml) — both configured;
# only one service runs at a time (systemd Conflicts= between ninfer and ninfer-us).
providers:
  ninfer:
    base_url: "http://127.0.0.1:8080/v1"
    model: "qwen3.8-27b"
    service: "ninfer.service"
    input: [text, image]
    context_window: 262144
    thinking_format: "qwen"

  ninfer-us:
    base_url: "http://127.0.0.1:8081/v1"
    model: "qwen38-huihui-abliterated-ninfer-nvfp4"
    service: "ninfer-us.service"
    input: [text, image]
    context_window: 262144
    thinking_format: "qwen"

  opencode-go-deepseek-pro:
    base_url: "https://opencode.ai/zen/go/v1"
    key_env: "OPENCODE_GO_API_KEY"
    session_header: "x-opencode-session: production-pack"
    stream_idle_timeout_ms: 1800000  # 30 min — long reasoning blocks
    model: "deepseek-v4-pro"
    input: [text, image]  # Supports vision for QA
    context_window: 1000000
    thinking_format: "deepseek"

  opencode-go-deepseek:
    base_url: "https://opencode.ai/zen/go/v1"
    key_env: "OPENCODE_GO_API_KEY"
    session_header: "x-opencode-session: production-pack"
    stream_idle_timeout_ms: 1800000
    model: "deepseek-v4.1-flash"
    input: [text, image]  # Accepts images — for QA
    context_window: 1000000
    thinking_format: "deepseek"

# Cloud: default agent routing. Local ninfer/ninfer-us available as fallback.
# When an ninfer unit is active it holds ~28–31 GB of the RTX 5090.
