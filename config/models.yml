# Model Configuration — cloud only, three tiers, no local LLM (decision 2026-10-18)
#
# THIS FILE IS DOCUMENTATION. The routing that actually runs lives ONLY in
# pipeline/set_agent_model.py (tier table, KNOWN_MODELS, env overrides). run.sh
# calls it before EVERY dsh launch and it rewrites the agent-default-model
# section of /root/.dsh/settings.yaml, so a route can never be inherited from
# the previous call. A routing error (exit 2) or a provider error (exit 3 —
# missing key, failed /models probe) HALTS the run (HALT_FOR_REVIEW.json +
# Discord); nothing reroutes, nothing retries.
#
# There is no local LLM any more: the GPU alternates between ComfyUI and the
# TTS cluster only (pipeline/gpu_owner.sh comfyui|tts|none|status).
#
# API keys: /root/.hermes/.env (ANTHROPIC_API_KEY, OPENCODE_GO_API_KEY) or the
# environment. Providers must also be registered for dsh in
# /root/.dsh/profiles/headless/cordis.patch.yml under `llm-pi-ai -> providers`:
# `anthropic` is a built-in pi-ai provider (api anthropic-messages); the
# OpenCode Go entries are custom openai-completions providers with base URL
# https://opencode.ai/zen/go/v1.
#
# Spend: pipeline/cloud_ledger.py writes <run_dir>/cloud_usage.json; caps
# CLOUD_MAX_CALLS_ANTHROPIC (12), CLOUD_MAX_USD_EST_ANTHROPIC (9),
# CLOUD_MAX_CALLS_OPENCODE (1500) — reaching a cap halts; Discord note at 50 % / 80 %.

tiers:
  creative:
    agents: [story-creator, story-editor, director]
    provider: "anthropic"
    model: "claude-opus-5-5"
    effort: "high"              # Opus 5.5: thinking always on; effort is the only depth control
    override_env: [DSH_CREATIVE_PROVIDER, DSH_CREATIVE_MODEL, DSH_CREATIVE_EFFORT]

  vision:
    agents: [qa-inspector]      # the ONLY agent that reads images
    provider: "opencode-go-deepseek"
    model: "gemini-3.8-flash"
    effort: "high"
    override_env: [DSH_VISION_PROVIDER, DSH_VISION_MODEL, DSH_VISION_EFFORT]

  execution:
    agents: [screenplay-reviewer, character-designer, location-designer, storyboard-artist,
             image-generator, video-generator, audio-producer, music-composer,
             pipeline-orchestrator, post-production-editor, dialogue-polish]
    provider: "opencode-go-deepseek"
    model: "deepseek-v4.1-flash"
    effort: "high"
    override_env: [DSH_EXECUTION_PROVIDER, DSH_EXECUTION_MODEL, DSH_EXECUTION_EFFORT]
    model_overrides:
      dialogue-polish: "gemini-3.8-flash"   # same provider, different model

# DSH_FORCE_TIER=execution routes ONE call onto the execution tier regardless of
# preset — run.sh uses it for the Director's mechanical per-scene gate so a lint
# fix never spends Opus. A provider override must name the model explicitly
# (DSH_<TIER>_PROVIDER without DSH_<TIER>_MODEL is a routing error).

providers:
  anthropic:
    base_url: "https://api.anthropic.com"
    models_url: "https://api.anthropic.com/v1/models"
    key_env: "ANTHROPIC_API_KEY"
    api: "anthropic-messages"   # built-in pi-ai provider
    known_models: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]
    input: [text]
    role: "creative tier"

  opencode-go-deepseek:
    base_url: "https://opencode.ai/zen/go/v1"
    models_url: "https://opencode.ai/zen/go/v1/models"
    key_env: "OPENCODE_GO_API_KEY"
    api: "openai-completions"   # custom provider in cordis.patch.yml
    known_models: [deepseek-v4.1-flash, gemini-3.8-flash, deepseek-v4-flash-vision-exp]
    input: [text, image]        # gemini-3.8-flash carries the vision tier
    context_window: 1000000
    role: "execution + vision tiers (prepaid pool: call-capped, costed at 0)"

# Tools: `set_agent_model.py --list` (tiers after env overrides),
# `--dry-run-all` (every preset's route), `--probe-all` (GET /models on every
# provider in use — run.sh step 0 halts on a failure), `<preset> --show`.
