# Model Configuration — LOCAL Strata LLM for reasoning + execution, cloud for vision
#
# Since 2026-10-11 every text agent runs on the local Qwen 3.8 Flash Next 125B
# served by Strata Swift (unit strata-swift-iq3-xxs, OpenAI API on :8321,
# dsh provider "strata-swift", model swift-1.5-iq3_xxs, 262k context,
# maxTokens 131072, effort xhigh). It is TEXT ONLY, so qa-inspector (the one
# vision agent) stays on OpenRouter gemini-3-flash-preview.
#
# The GPU has exactly ONE owner at a time — Strata LLM | ComfyUI | TTS cluster —
# enforced by systemd Conflicts= (pipeline/systemd/). The LLM holds ~31.8 GB of
# the 32.6 GB card and takes ~2 min to start; pipeline/gpu_owner.sh switches
# owner and waits, pipeline/llm_monitor.py restarts the LLM after a crash/hang
# whenever no other owner holds the GPU.
#
# dsh-engine-switch plugin is NOT installed (404s on npm), so per-preset
# engine declarations in agent.cordis.yml are inert. run.sh rewrites the
# agent-default-model section of ~/.dsh/settings.yaml before each agent call
# via pipeline/set_agent_model.py (single source of truth, reads pipeline/local_llm.py).

routing:
  reasoning_agents:
    - story-creator
    - director
    - screenplay-reviewer
    - character-designer
    - location-designer
  reasoning_provider: "strata-swift"
  reasoning_model: "swift-1.5-iq3_xxs"
  reasoning_effort: "xhigh"

  execution_agents:
    - storyboard-artist
    - image-generator
    - audio-producer
    - music-composer
    - video-generator
    - pipeline-orchestrator
    - subtitle-generator
    - post-production-editor
  execution_provider: "strata-swift"
  execution_model: "swift-1.5-iq3_xxs"
  execution_effort: "xhigh"

  vision_agents:
    - qa-inspector
  vision_provider: "openrouter"
  vision_model: "google/gemini-3-flash-preview"
  vision_effort: "high"

providers:
  strata-swift:
    base_url: "http://127.0.0.1:8321/v1"
    model: "swift-1.5-iq3_xxs"
    service: "strata-swift-iq3-xxs.service"
    health: "http://127.0.0.1:8321/v1/models"
    input: [text]
    context_window: 262144
    max_tokens: 131072
    vram_gb: 31.8
    ram_gb: 40
    start_seconds: 120            # unit TimeoutStartSec=300
    thinking_format: "qwen"
    exclusive_with: [comfyui.service, tts-cluster.service]

  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    key_env: "OPENROUTER_API_KEY"
    model: "google/gemini-3-flash-preview"
    input: [text, image]
    role: "QA vision only"

  # Retired local providers — units are MASKED on 207, kept for reference only
  ninfer:
    base_url: "http://127.0.0.1:8080/v1"
    model: "qwen3.8-27b"
    service: "ninfer.service"
    retired: true
  ninfer-us:
    base_url: "http://127.0.0.1:8081/v1"
    model: "qwen38-huihui-abliterated-ninfer-nvfp4"
    service: "ninfer-us.service"
    retired: true

  opencode-go-deepseek-pro:
    base_url: "https://opencode.ai/zen/go/v1"
    key_env: "OPENCODE_GO_API_KEY"
    model: "deepseek-v4-pro"
    input: [text, image]
    context_window: 1000000
    role: "cloud fallback (reasoning)"
  opencode-go-deepseek:
    base_url: "https://opencode.ai/zen/go/v1"
    key_env: "OPENCODE_GO_API_KEY"
    model: "deepseek-v4.1-flash"
    input: [text, image]
    context_window: 1000000
    role: "cloud fallback (execution)"
