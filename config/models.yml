# Model Configuration — Cloud routing via OpenCode Go
#
# 2026-09-21: Switched from local LLMs to cloud models.
# All agents run on OpenCode Go — no local LLM needed during production.
# RTX 5090 is 100% dedicated to ComfyUI (image/video generation).
#
# dsh-engine-switch plugin is NOT installed (404s on npm), so per-preset
# engine declarations in agent.cordis.yml are inert. Instead, run.sh
# rewrites the agent-default-model section of ~/.dsh/settings.yaml
# before each agent call via set_agent_model().

# Per-preset model routing (managed by run.sh set_agent_model)
routing:
  # Reasoning + vision agents → DeepSeek V4 Pro (text+image, 1M context, high effort)
  reasoning_agents:
    - story-creator
    - director
    - screenplay-reviewer
    - character-designer
    - location-designer
    - qa-inspector
  reasoning_provider: "opencode-go-deepseek-pro"
  reasoning_model: "deepseek-v4-pro"
  reasoning_effort: "high"

  # Execution agents → DeepSeek V4.1 Flash (text+image, 1M context, low effort)
  execution_agents:
    - storyboard-artist
    - image-generator
    - audio-producer
    - music-composer
    - video-generator
    - qa-inspector
    - pipeline-orchestrator
    - subtitle-generator
    - post-production-editor
  execution_provider: "opencode-go-deepseek"
  execution_model: "deepseek-v4.1-flash"
  execution_effort: "low"

# Cloud provider config (in ~/.dsh/settings.yaml)
providers:
  opencode-go-deepseek-pro:
    base_url: "https://opencode.ai/zen/go/v1"
    key_env: "OPENCODE_GO_API_KEY"
    session_header: "x-opencode-session: production-pack"
    stream_idle_timeout_ms: 1800000  # 30 min — long reasoning blocks
    model: "deepseek-v4-pro"
    input: [text, image]  # Supports vision for QA
    context_window: 1000000
    thinking_format: "deepseek"

  opencode-go-deepseek:
    base_url: "https://opencode.ai/zen/go/v1"
    key_env: "OPENCODE_GO_API_KEY"
    session_header: "x-opencode-session: production-pack"
    stream_idle_timeout_ms: 1800000
    model: "deepseek-v4.1-flash"
    input: [text, image]  # Accepts images — for QA
    context_window: 1000000
    thinking_format: "deepseek"

# VRAM impact: NONE for LLM — all cloud
# RTX 5090 32GB is fully available for ComfyUI generation
