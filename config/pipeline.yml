# Production Pack Pipeline Configuration

project:
  name: "production-pack"
  style: "pixar-fantasy"
  output_dir: "./output"

# Service endpoints
services:
  comfyui:
    host: "127.0.0.1"
    port: 8188
    api_url: "http://127.0.0.1:8188/api"
    ws_url: "ws://127.0.0.1:8188/ws"
    health_check_interval: 5  # seconds
    restart_timeout: 60       # seconds

  # Every agent runs in the cloud (decision 2026-10-18) — there is NO local LLM.
  # The GPU alternates between ComfyUI and the TTS cluster only. The routing that
  # runs is pipeline/set_agent_model.py; config/models.yml documents it. These
  # three entries are documentation of the tier defaults.
  cloud_creative:
    agents: [story-creator, story-editor, director]
    provider: "anthropic"
    model: "claude-opus-5-5"
    effort: "high"
    base_url: "https://api.anthropic.com"
    key_env: "ANTHROPIC_API_KEY"

  cloud_vision:
    agents: [qa-inspector]
    provider: "opencode-go-deepseek"
    model: "gemini-3.8-flash"
    effort: "high"
    base_url: "https://opencode.ai/zen/go/v1"
    key_env: "OPENCODE_GO_API_KEY"
    input: [text, image]    # the only tier that reads images

  cloud_execution:
    agents: "everything else (dialogue-polish overrides the model to gemini-3.8-flash)"
    provider: "opencode-go-deepseek"
    model: "deepseek-v4.1-flash"
    effort: "high"
    base_url: "https://opencode.ai/zen/go/v1"
    key_env: "OPENCODE_GO_API_KEY"

  chatterbox:
    host: "127.0.0.1"
    port: 9882
    model: "chatterbox-turbo"
    api_url: "http://127.0.0.1:9882"
    vram: "4-6 GB"
    use_for: "primary character dialogue"

  cosyvoice:
    host: "127.0.0.1"
    port: 9880
    model: "CosyVoice3-0.5B"
    api_url: "http://127.0.0.1:9880"
    vram: "4-6 GB"
    use_for: "multilingual/cross-lingual dialogue, instruction-based emotion"

  kokoro:
    host: "127.0.0.1"
    port: 9881
    model: "kokoro-v1"
    api_url: "http://127.0.0.1:9881"
    vram: "2-3 GB"
    use_for: "narration only"

  orpheus:
    host: "127.0.0.1"
    port: 9883
    model: "orpheus-3b"
    api_url: "http://127.0.0.1:9883"
    vram: "8-12 GB"
    use_for: "expressive emotional dialogue (load on demand, unload after use)"

# Image generation settings (Qwen Image 2.1)
image_generation:
  model: "Qwen-Image-2.1"
  default_resolution: "2048x2048"
  character_sheet_resolution: "2048x2048"
  first_frame_resolution: "1920x1080"
  max_reference_images: 10
  steps: 30
  cfg_scale: 7.0

# Video generation settings (MiniMax H3)
video_generation:
  model: "MiniMax-H3"
  min_duration: 3
  max_duration: 15
  default_duration: 6
  output_resolution: "1344x768"   # 768p for turbo LoRA, upscaled to 4K in post
  default_mode: "reference"

  # Turbo LoRA configuration — faster generation with fewer steps
  turbo:
    ref2va:
      lora: "minimax/minimax_h3_ref2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors"
      steps: 8
      sampler: "res_multistep"
      scheduler: "simple"
      lora_strength: 0.75
    fl2va:
      lora: "minimax/minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors"
      steps: 8
      sampler: "res_multistep"
      scheduler: "simple"
      lora_strength: 0.75

  avoid_modes:
    - "text_to_video"

# QA settings
qa:
  max_retries: 3
  vision_model: "gemini-3.8-flash"  # vision tier (opencode-go-deepseek) — see pipeline/set_agent_model.py
  checks:
    - hand_anomalies
    - face_distortion
    - character_duplication
    - motion_artifacts
    - texture_instability
    - identity_drift
    - lip_sync_correctness
    - audio_quality
    - temporal_consistency
    - composition_check
  # Calibrated gate (2026-10-16, knowledge/minimax_h3_rules.md §0) — normalise_qa_verdict.py
  pass_threshold: 0.75       # weighted overall
  structural_floor: 0.70     # hands_limbs, face_expression, character_identity, duplication, motion_quality, composition, continuity
  soft_categories: [texture_visual, film_quality, audio_quality, voice_quality, lip_sync]   # notes for assembly, never a FAIL alone
  prompt_word_budget: 900    # whole H3 prompt; detailed_description 350-500 (official)
  max_named_characters: 3    # per clip; extras uncounted, backs to camera

# Audio settings
audio:
  # Engine selection is per-character, decided by Audio Producer (see decision tree)
  engines:
    default_dialogue: "chatterbox"        # best naturalness + cloning
    multilingual_dialogue: "cosyvoice3"   # cross-lingual, instruction emotion
    emotional_dialogue: "orpheus3b"       # intense emotion tags (load on demand)
    narration: "kokoro"                   # lightweight, consistent narrator voice
  sample_rate: 44100
  format: "wav"
  voice_reference_duration: 5  # seconds of ref audio for cloning
  dialogue_before_video: true  # CRITICAL: dialogue audio generated BEFORE video for lip sync
  narration_after_clips: true  # narration overlaid in post, no lip sync

# Pipeline orchestration
orchestration:
  cloud_llm: true                  # All agents on cloud — there is no local LLM
  stop_local_llms: true            # gpu_owner.sh stops any retired LLM unit before a hand-over
  auto_restart_comfyui: true
  monitoring_interval: 2           # seconds
  clip_generation_timeout: 600     # seconds (10 min per clip incl. upscale)
  dsh_permission_mode: "danger-full-access"  # Headless has no approval channel
  stream_idle_timeout_ms: 1800000  # 30 min — cloud models can pause during reasoning
