# /etc/systemd/system/strata-swift-iq3-xxs.service.d/10-exclusive.conf — production pack
# The Strata LLM (Qwen 3.8 Flash Next, ~31.8 GB VRAM) is one of three exclusive
# GPU owners (ComfyUI | TTS cluster | Strata LLM). Its own unit already stops
# ComfyUI in ExecStartPre; this makes the exclusion symmetric and adds the TTS set.
[Unit]
Conflicts=comfyui.service tts-cluster.service orpheus-backend.service orpheus-tts.service chatterbox-tts.service cosyvoice.service kokoro-tts.service
