# /etc/systemd/system/comfyui.service.d/10-exclusive.conf — production pack
# ComfyUI is one of three exclusive GPU owners (ComfyUI | TTS cluster | Strata LLM).
# Starting it stops the other two; starting either of them stops ComfyUI.
[Unit]
