# /etc/systemd/system/strata-swift-iq3-xxs.service.d/20-announce-ready.conf — production pack
# "The LLM announces that it is back": after the engine starts, wait for the API
# (≤ 270 s, inside TimeoutStartSec=300), write output/.llm_ready, clear
# output/.llm_parked and post "LLM back — resuming" to Discord. The pipeline's
# agent retry loop (run.sh run_dsh_agent) waits for that file instead of
# re-issuing a turn against a model that is still loading. Never fails the unit.
[Service]
Environment=PACK_DIR=/root/production_pack
ExecStartPost=/bin/bash /root/production_pack/pipeline/llm_ready_notify.sh
