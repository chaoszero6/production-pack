[Service]
# docker-compose.yml was overwritten on 2026-09-21 10:39 with an unrelated
# service (llama-cpp-blackwell / port 8095) that carries a build: step, so
# starting this unit tried to rebuild an image and failed on DNS resolution.
# Point the unit at the dedicated compose file for the 122B instead.
ExecStart=
ExecStart=/usr/bin/docker compose -f docker-compose-qwen3.5-122b-cuda.yml up -d --remove-orphans
ExecStop=
ExecStop=/usr/bin/docker compose -f docker-compose-qwen3.5-122b-cuda.yml down
ExecReload=
ExecReload=/usr/bin/docker compose -f docker-compose-qwen3.5-122b-cuda.yml up -d --force-recreate
